services:
  - type: web
    name: truthlens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://truthlens-ai.vercel.app
      - key: TRUST_PROXY
        value: "1"
